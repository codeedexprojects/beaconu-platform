services:
  - type: web
    name: beaconu-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && NODE_OPTIONS=--max-old-space-size=4096 pnpm turbo build --filter=@beaconu/api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: development
