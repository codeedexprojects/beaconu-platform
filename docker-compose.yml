services:
  postgres-dev:
    image: postgres:16
    container_name: postgres-dev
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-dev:
    image: redis:7
    container_name: redis-dev
    ports:
      - "6379:6379"

volumes:
  postgres_data:
